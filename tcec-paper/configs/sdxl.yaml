# DDIM 50 steps, 512x512 (paper Sec. 4.1, Table 1). DeepCompressor ships no SDXL file;
# the skip lists follow its pixart-sigma and flux configs.
pipeline:
  name: sdxl
  dtype: torch.float16
eval:
  height: 512
  width: 512
  num_steps: 50
  guidance_scale: 5.0     # the paper does not state it; 5.0 is the diffusers default for SDXL
  protocol: ddim{num_steps}-g{guidance_scale}
  num_gpus: 1
quant:
  calib:
    batch_size: 16
  wgts:
    calib_range:
      element_batch_size: 64
      sample_batch_size: 16
      element_size: 512
      sample_size: -1
    low_rank:
      sample_batch_size: 16
      sample_size: -1
    skips:
    - embed
    - resblock_shortcut
    - resblock_time_proj
    - transformer_proj_in
    - transformer_proj_out
    - down_sample
    - up_sample
  ipts:
    calib_range:
      element_batch_size: 64
      sample_batch_size: 16
      element_size: 512
      sample_size: -1
    skips:
    - embed
    - resblock_shortcut
    - resblock_time_proj
    - transformer_proj_in
    - transformer_proj_out
    - transformer_norm
    - transformer_add_norm
    - down_sample
    - up_sample
  opts:
    calib_range:
      element_batch_size: 64
      sample_batch_size: 16
      element_size: 512
      sample_size: -1
  smooth:
    proj:
      element_batch_size: -1
      sample_batch_size: 16
      element_size: -1
      sample_size: -1
    attn:
      sample_batch_size: 16
      sample_size: -1
